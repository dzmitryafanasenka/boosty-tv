<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></helmet>
<div style="width:{{w}};height:240px;box-sizing:border-box;padding:12px;border-radius:18px;display:flex;gap:32px;background:{{bg}};outline:{{ring}};outline-offset:4px;transform:{{tf}};box-shadow:{{shadow}};font-family:'Golos Text',sans-serif;color:#F4EFE7;transition:transform 160ms cubic-bezier(0.2,0,0,1)">
  <div style="flex:none;position:relative;width:384px;height:216px;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(135deg, oklch(0.31 0.03 200) 0 16px, oklch(0.28 0.03 200) 16px 32px)">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:16px;color:rgba(244,239,231,0.45)">обложка эфира</div>
    <sc-if value="{{locked}}">
      <div style="position:absolute;inset:0;background:rgba(14,12,11,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="width:30px;height:24px;box-sizing:border-box;border:5px solid #F4EFE7;border-bottom:none;border-radius:15px 15px 0 0"></div>
        <div style="width:46px;height:34px;border-radius:6px;background:#F4EFE7"></div>
      </div>
    </sc-if>
    <div style="position:absolute;left:14px;top:14px;height:40px;box-sizing:border-box;padding:0 14px;border-radius:8px;background:{{badgeBg}};display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600">
      <sc-if value="{{isLive}}" hint-placeholder-val="{{true}}"><div style="width:10px;height:10px;border-radius:50%;background:#FFFFFF"></div></sc-if>
      {{badge}}
    </div>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding-right:24px">
    <div style="font-size:22px;font-weight:600;color:{{stColor}}">{{statusText}}</div>
    <div style="font-size:30px;line-height:38px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{s.title}}</div>
    <div style="font-size:22px;color:#A9A299">{{stats}}</div>
    <sc-if value="{{locked}}"><div style="font-size:22px;font-weight:600;color:#F2A462">Нужен уровень подписки «{{s.level}}»</div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:280},&quot;s&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;f&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1040,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.s || { status: 'live', title: 'Название эфира', viewers: 1204, likes: 356, elapsed: 4350, access: true };
    const f = !!this.props.f;
    const live = s.status === 'live', ended = s.status === 'ended';
    const n = (x) => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
    const pl = (x, a, b, c) => { const m = x % 10, h = x % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
    const el = s.elapsed || 0, hh = Math.floor(el / 3600), mm = Math.floor((el % 3600) / 60);
    return {
      s, w: (this.props.w ?? 1040) + 'px',
      bg: f ? '#34302C' : '#221F1D',
      ring: f ? '4px solid #F4EFE7' : '4px solid transparent',
      tf: f ? 'scale(1.03)' : 'none',
      shadow: f ? '0 18px 40px rgba(0,0,0,0.5)' : 'none',
      isLive: live, locked: s.access === false,
      badge: live ? 'LIVE' : ended ? 'Завершён' : 'Запланирован',
      badgeBg: live ? '#C93C32' : 'rgba(18,16,14,0.85)',
      stColor: live ? '#F08C7C' : '#B7B0A6',
      statusText: live ? `Идёт эфир · ${hh ? hh + ' ч ' : ''}${mm} мин` : ended ? 'Эфир завершён' : `Начало ${s.when}`,
      stats: live ? `${n(s.viewers)} ${pl(s.viewers, 'зритель', 'зрителя', 'зрителей')} · ${n(s.likes)} ${pl(s.likes, 'лайк', 'лайка', 'лайков')}` : `${n(s.likes)} ${pl(s.likes, 'лайк', 'лайка', 'лайков')}`
    };
  }
}
</script>
</body>
</html>
