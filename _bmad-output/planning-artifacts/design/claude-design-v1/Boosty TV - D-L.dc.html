<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E6E3DE;} a{color:#A8581A;} a:hover{color:#7A3F12;}</style>
</helmet>
<section style="padding:120px 120px 40px;font-family:'Golos Text',sans-serif;color:#1E1C1A;display:flex;flex-direction:column;gap:16px">
  <div style="font-size:88px;font-weight:700;letter-spacing:-0.02em">Boosty TV — экраны D–L</div>
  <div style="font-size:32px;line-height:1.45;color:#4F4A44;max-width:2000px">Продолжение макетов A–C. Те же компоненты, данные и правила фокуса. Под каждым кадром — начальный фокус, переходы и ID из feature-parity.</div>
</section>
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
  <section id="{{sec.key}}" style="padding:80px 120px;font-family:'Golos Text',sans-serif;color:#1E1C1A;display:flex;flex-direction:column;gap:56px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:72px;font-weight:700;letter-spacing:-0.02em">{{sec.title}}</div>
      <div style="font-size:28px;color:#5A554F;max-width:2400px">{{sec.sub}}</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:120px;max-width:3960px;align-items:flex-start">
      <sc-for list="{{sec.items}}" as="it" hint-placeholder-count="2">
        <div id="{{it.id}}" style="width:1920px;display:flex;flex-direction:column;gap:28px">
          <div style="display:flex;align-items:center;gap:20px"><div style="background:#1E1C1A;color:#F4EFE7;font-family:'JetBrains Mono',monospace;font-size:28px;padding:6px 16px;border-radius:8px">{{it.id}}</div><div style="font-size:36px;font-weight:600">{{it.name}}</div></div>
          <div style="position:relative;width:1920px;height:1080px;overflow:hidden;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,0.18);background:#171615">
            <sc-if value="{{it.isAuthor}}"><dc-import name="Author Page" aid="{{it.p.aid}}" focus="{{it.p.focus}}" panel="{{it.p.panel}}" pf="{{it.p.pf}}" filters="{{it.p.filters}}" search="{{it.p.search}}" custom="{{it.p.custom}}" loading="{{it.p.loading}}" hint-size="1920px,1080px"></dc-import></sc-if>
            <sc-if value="{{it.isSearch}}"><dc-import name="Search Screen" q="{{it.p.q}}" kb="{{it.p.kb}}" status="{{it.p.status}}" focus="{{it.p.focus}}" ids="{{it.p.ids}}" hint-size="1920px,1080px"></dc-import></sc-if>
            <sc-if value="{{it.isPost}}"><dc-import name="Post Screen" id="{{it.p.id}}" focus="{{it.p.focus}}" ui="{{it.p.ui}}" hint-size="1920px,1080px"></dc-import></sc-if>
            <sc-if value="{{it.isPlayer}}"><dc-import name="Player Screen" v="{{it.p.v}}" pos="{{it.p.pos}}" playing="{{it.p.playing}}" overlay="{{it.p.overlay}}" focus="{{it.p.focus}}" panel="{{it.p.panel}}" pf="{{it.p.pf}}" quality="{{it.p.quality}}" speed="{{it.p.speed}}" seek="{{it.p.seek}}" buffering="{{it.p.buffering}}" recovering="{{it.p.recovering}}" error="{{it.p.error}}" live="{{it.p.live}}" ended="{{it.p.ended}}" hint-size="1920px,1080px"></dc-import></sc-if>
            <sc-if value="{{it.isEvents}}"><dc-import name="Events Screen" mode="{{it.p.mode}}" focus="{{it.p.focus}}" hint-size="1920px,1080px"></dc-import></sc-if>
            <sc-if value="{{it.isSettings}}"><dc-import name="Settings Screen" focus="{{it.p.focus}}" mode="{{it.p.mode}}" sys="{{it.p.sys}}" diag-unlocked="{{it.p.diagUnlocked}}" modal="{{it.p.modal}}" saved="{{it.p.saved}}" hint-size="1920px,1080px"></dc-import></sc-if>
            <sc-if value="{{it.isState}}"><dc-import name="State Screen" kind="{{it.p.kind}}" current="{{it.p.current}}" section="{{it.p.section}}" hint-size="1920px,1080px"></dc-import></sc-if>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{it.notes}}" as="n" hint-placeholder-count="3">
              <div style="display:flex;gap:20px;font-size:24px;line-height:1.45;color:#3B3835"><div style="flex:none;width:170px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#7A746C;padding-top:3px">{{n.k}}</div><div style="text-wrap:pretty">{{n.v}}</div></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{sec.hasRefs}}">
      <div style="display:flex;flex-direction:column;gap:12px;max-width:2400px">
        <div style="font-size:28px;font-weight:600">Остальные системные состояния уже нарисованы</div>
        <sc-for list="{{sec.refs}}" as="r" hint-placeholder-count="4">
          <div style="display:flex;gap:20px;font-size:24px;line-height:1.45;color:#3B3835"><div style="flex:none;width:300px;font-weight:600">{{r.k}}</div><div>{{r.v}}</div></div>
        </sc-for>
      </div>
    </sc-if>
  </section>
</sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const N = (o) => Object.entries(o).map(([k, v]) => ({ k, v }));
    const it = (type, id, name, p, notes) => ({ id, name, p, notes: N(notes), isAuthor: type === 'A', isSearch: type === 'S', isPost: type === 'P', isPlayer: type === 'V', isEvents: type === 'E', isSettings: type === 'K', isState: type === 'L' });
    const bought = { access: 'bought' }, bt = { access: 'bought', tags: ['Выпечка'] };
    const v2 = { title: 'Квашеная капуста по бабушкиному рецепту: два способа и одна ошибка', sub: 'Видео 2 из 2 · Способ 2. В ведре с яблоками', name: 'Марина Лебедева', ini: 'МЛ', hue: 40, dur: 1462 };
    const live = { status: 'live', title: 'Разбор партий турнира в Вейк-ан-Зее', viewers: 1204, likes: 356, elapsed: 4350, access: true };
    const vl = { title: 'Разбор партий турнира в Вейк-ан-Зее', sub: '', name: 'Артём Брагин', ini: 'АБ', hue: 200, dur: 1 };
    const sections = [
      { key: 'D', title: 'D. Автор', sub: 'AUTHOR-PAGE-01…03 · LIVE-01…05 · FILTER-01…04. Описание и обложка блога не показываются: их наличие в API не подтверждено.', items: [
        it('A', 'D1', 'Автор с идущим эфиром', { aid: 'ab', focus: 'live' }, { 'Фокус': 'Карточка эфира, если эфир идёт. Иначе — первая публикация.', '← →': 'Карточка → «Нравится» (↓ «Поделиться»). ← из карточки → сайдбар.', '↑ ↓': '↑ → «Поиск в блоге». ↓ → первая публикация.', 'OK': 'Плеер эфира (G11). «Поделиться» → QR со ссылкой на эфир (LIVE-05).', 'Back': 'Подписки, фокус на плитке этого автора.', 'Решение': 'Нужный уровень подписки показываем названием, без цены (LIVE-01 отдаёт цену, но оплаты в приложении нет).' }),
        it('A', 'D2', 'Эфир запланирован, нужен уровень', { aid: 'ko', focus: 'post-0' }, { 'Карточка': 'Запланированный эфир не фокусируется — действия нет. Статус перезапрашивается раз в 30 с (LIVE-01).', 'Нет доступа': 'Если эфир идёт, а доступа нет, карточка фокусируется и OK открывает QR со страницей эфира (так ведёт себя LIVE-02). Кнопок оплаты нет.', 'Фокус': 'Первая публикация.' }),
        it('A', 'D3', 'Публикации автора', { aid: 'ml', focus: 'post-1' }, { 'Сетка': '4 колонки, страницы по 20 (AUTHOR-PAGE-01), подгрузка и ошибка — как на Главной (B4, B5).', 'Возврат': 'После поста и плеера — та же карточка по post id и та же прокрутка.', '↑': 'Из первого ряда → «Поиск в блоге» (или карточка эфира, если она есть).' }),
        it('A', 'D4', 'Фильтры: доступ', { aid: 'ml', focus: 'filters', panel: 'filters', pf: 'acc-2', filters: bought, loading: true }, { 'Панель': 'Изолирует фокус: ← и → не выходят из панели. Back закрывает её, фокус возвращается на «Фильтры».', 'Применение': 'Каждое изменение сразу перезапрашивает список (FILTER-04). Список за панелью приглушён и подписан «Обновляем…».', 'Фокус': 'При открытии — выбранный вариант доступа.', 'ID': 'FILTER-01: «Доступные мне» по умолчанию.' }),
        it('A', 'D5', 'Фильтры: теги', { aid: 'ml', focus: 'filters', panel: 'filters', pf: 'tag-0', filters: bt }, { 'Теги': 'Мультивыбор, OK переключает отметку (FILTER-03). Теги блога приходят одной страницей.', 'Сбросить': 'Недоступна, пока фильтры по умолчанию; не получает фокус.', '↑ ↓': 'Один столбец сверху вниз, без зацикливания.' }),
        it('A', 'D6', 'Период: варианты', { aid: 'ml', focus: 'filters', panel: 'period', pf: 'per-4', filters: bought }, { 'Решение': 'Вместо календаря — готовые периоды и «Свой период…». Это заменяет веб-календарь (FILTER-02).', 'OK': 'Выбор применяется сразу и возвращает в панель фильтров.', 'Back': 'Панель фильтров, фокус на строке «Период».' }),
        it('A', 'D7', 'Свой период', { aid: 'ml', focus: 'filters', panel: 'custom', pf: 'fm', filters: { period: 'custom' }, custom: [[1, 8, 2026], [25, 9, 2026]] }, { 'Управление': '↑ ↓ меняют день, месяц или год, ← → переходят между полями. OK на любом поле переводит фокус на «Готово», ↑ с «Готово» — на первое поле.', 'Границы': 'Начало дня и конец дня в часовом поясе приставки (from_ts / to_ts). «По» не может быть раньше «С» — значение подтягивается.', 'Back': 'Список периодов.' }),
        it('A', 'D8', 'Активные фильтры', { aid: 'ml', focus: 'reset', filters: bt }, { 'Видимость': 'Число на «Фильтры» и строка с активными значениями. Заголовок показывает, сколько найдено.', 'Сбросить': 'Возвращает «Доступные мне», период и теги очищаются. Кнопка исчезает, фокус переходит на «Фильтры».', 'Сценарий 5': '«Только купленные» + «Выпечка» → 2 поста → «Сбросить».' }),
        it('A', 'D9', 'Поиск в блоге: клавиатура', { aid: 'ml', focus: 'search', search: { kb: true, q: 'пиро' } }, { 'Область': 'Подпись «В этом блоге» в поле. Поиск идёт по E7 только внутри автора.', 'Клавиатура': 'Системная. «Готово» запускает поиск и возвращает фокус на первую найденную карточку; если ничего — на поле.' }),
        it('A', 'D10', 'Поиск в блоге: результат', { aid: 'ml', focus: 'post-0', search: { active: true, q: 'пирог' } }, { 'Комбинация': 'Поиск учитывает активные фильтры (AUTHOR-PAGE-02).', 'Back': 'Сначала сбрасывает запрос и возвращает обычный список с фокусом на поле поиска. Следующий Back — выход из автора.', 'Эфир': 'Пока активен поиск, карточка эфира скрыта.' }),
        it('A', 'D11', 'Поиск в блоге: ничего не найдено', { aid: 'ml', focus: 'search', search: { active: true, q: 'плов' } }, { 'Фокус': 'Кнопка поиска — можно сразу исправить запрос.', 'Действие': '«Сбросить» очищает и запрос, и фильтры.' })
      ] },
      { key: 'E', title: 'E. Поиск по подпискам', sub: 'FEED-04 · SEARCH-SCOPES. Только две области: лента подписок (здесь) и блог автора (D9–D11). Глобального поиска нет.', items: [
        it('S', 'E1', 'Поиск: начальное состояние', { focus: 'field' }, { 'Фокус': 'Поле. OK открывает системную клавиатуру.', 'Область': 'Метка «по подпискам» и строка-пояснение под полем.', '→': '«Фильтры» — те же фильтры, что у ленты.', '←': 'Сайдбар на «Поиск».' }),
        it('S', 'E2', 'Системная клавиатура', { focus: 'field', kb: true, q: 'капу' }, { 'Ввод': 'Стрелки уходят в клавиатуру системы, наше приложение их не обрабатывает.', 'Готово': 'Запускает поиск. Фокус возвращается на первую карточку результата, если результатов нет — на поле.', 'Back': 'Закрывает клавиатуру без поиска, фокус на поле.' }),
        it('S', 'E3', 'Загрузка', { focus: 'field', q: 'капуста', status: 'loading' }, { 'Фокус': 'Остаётся на поле, пока идёт запрос. Skeleton-ряд показывает место результатов.' }),
        it('S', 'E4', 'Результаты', { focus: 'res-0', q: 'выпуск', status: 'results', ids: ['podcast', 'vyp86'] }, { 'OK': 'Пост. Back из поста возвращает сюда с тем же запросом, той же карточкой и прокруткой (сценарий 4).', '↑': 'Из первого ряда → поле.', 'Пагинация': 'Курсорная, как в ленте (FEED-02).' }),
        it('S', 'E5', 'Ничего не найдено', { focus: 'field', q: 'рецепт плова', status: 'empty' }, { 'Фокус': 'Поле — чтобы сразу исправить запрос.', 'Подсказка': 'Напоминаем, что фильтры тоже сужают поиск.' }),
        it('S', 'E6', 'Ошибка поиска', { focus: 'retry', q: 'капуста', status: 'error' }, { 'Фокус': '«Повторить». Запрос сохранён.', '↑': 'Поле.' })
      ] },
      { key: 'F', title: 'F. Пост', sub: 'POST-01…11. Отдельный экран поста — улучшение клиента (POST-11): в BoostBuddy пост раскрыт прямо в ленте. Комментариев нет.', items: [
        it('P', 'F1', 'Пост с двумя видео', { id: 'kapusta', focus: 'play' }, { 'Фокус': '«Смотреть» / «Продолжить» — основное действие. Если видео нет — первый блок справа.', 'Слева': 'Автор (OK → страница автора), заголовок, дата, лайки только для чтения (POST-10).', '→': 'В колонку содержимого на первый фокусируемый блок.', 'Back': 'Туда, откуда открыли пост, на ту же карточку.' }),
        it('P', 'F2', 'Выбор видео 2', { id: 'kapusta', focus: 'vid-1' }, { 'Список': 'У каждого видео свой прогресс по id (POST-04, PLAY-03). Длительность — только если её знает локальная история.', 'OK': 'Плеер с этим видео. После выхода фокус вернётся на эту строку.', '←': 'Основное действие.' }),
        it('P', 'F3', 'Продолжить и «С начала»', { id: 'slab', focus: 'restart' }, { 'Продолжить': 'Позиция из timeCode свежего поста (E8).', 'С начала': 'Улучшение клиента (PLAY-03). Появляется, только если есть позиция.' }),
        it('P', 'F4', 'Длинный текст свёрнут', { id: 'akvarel', focus: 'more' }, { 'Свёрнуто': 'Первые три абзаца. «Читать полностью» раскрывает текст на месте.', 'Форматирование': 'Жирный, курсив, подчёркнутый, ссылки, эмодзи-картинки (POST-02).' }),
        it('P', 'F5', 'Текст раскрыт, изображения, заглушка', { id: 'akvarel', focus: 'img-1', ui: { expanded: true } }, { 'Чтение': 'После раскрытия каждый абзац — точка остановки для ↓, иначе текст нельзя прокрутить пультом.', 'Изображения': 'Фокусируются только для прокрутки (POST-03).', 'Заглушка': 'Неизвестный блок — пунктирная рамка без фокуса (POST-09).' }),
        it('P', 'F6', 'Файл, ссылка, внешнее видео', { id: 'file', focus: 'file-0' }, { 'Решение': 'Ссылки из текста вынесены отдельными кнопками под абзацем: двигать фокус внутри строки текста пультом неудобно.', 'OK': 'Файл, ссылка и YouTube открываются QR-кодом (POST-02, POST-05, POST-07).' }),
        it('P', 'F7', 'QR-диалог', { id: 'file', focus: 'file-0', ui: { qr: { title: 'verstak_chertezhi.pdf', sub: 'Файл · 2,4 МБ', note: 'Ссылка подписана Boosty и действует ограниченное время. Если не откроется — закройте и откройте QR снова.' } } }, { 'Фокус': '«Закрыть» — единственный элемент. Фокус изолирован.', 'Back / OK': 'Закрывают диалог, фокус возвращается на строку файла (сценарий 8).', 'Безопасность': 'Подписанная ссылка показывается только в QR, текстом не выводится.' }),
        it('P', 'F8', 'Закрытый пост', { id: 'locked', focus: 'author' }, { 'Контент': 'Только тизер (POST-08). Видео и вложения не показываются.', 'Текст': 'Объясняем, где оформляется подписка. Цен, кнопок оплаты и обещаний доступа нет.', 'Фокус': 'Автор — единственное действие.' })
      ] },
      { key: 'G', title: 'G. Видеоплеер', sub: 'PLAY-01…13 · LIVE-02. Back: панель → оверлей → выход с восстановлением карточки. Оверлей не прячется при паузе, перемотке, настройках и ошибке.', items: [
        it('V', 'G1', 'Без оверлея', { v: v2, pos: 760, overlay: false }, { 'Клавиши': 'OK — пауза и показ оверлея. ← → — перемотка сразу, без открытия оверлея; оверлей появляется с пузырём позиции. ↑ ↓ — показать оверлей.', 'Медиаклавиши': 'Play/Pause, FF/Next, Prev — как PLAY-06. Menu/Info — настройки.', 'Back': 'Выход из плеера, позиция отправляется на сервер (PLAY-04).' }),
        it('V', 'G2', 'Оверлей', { v: v2, pos: 760, focus: 'tl' }, { 'Фокус': 'Таймлайн. OK на нём — пауза, ← → — перемотка 5 с.', '↓': 'Кнопки: пауза, «Настройки».', 'Скрытие': 'Через 5 с во время воспроизведения (PLAY-05).', 'Автор': 'Имя автора в оверлее — улучшение клиента (PLAY-11).' }),
        it('V', 'G3', 'Пауза', { v: v2, pos: 760, playing: false, focus: 'pp' }, { 'Оверлей': 'Не скрывается, пока пауза.', 'Сервер': 'При паузе позиция записывается сразу (PLAY-12, улучшение клиента).' }),
        it('V', 'G4', 'Буферизация', { v: v2, pos: 760, overlay: false, buffering: true }, { 'Индикатор': 'Появляется только если ожидание дольше 500 мс (PLAY-10). Кольцо вращается, 1 оборот за 900 мс.' }),
        it('V', 'G5', 'Перемотка', { v: v2, pos: 760, seek: 940, focus: 'tl' }, { 'Шаг': '5 с за нажатие. При удержании шаг растёт: 5 → 10 → 20 → 30 с.', 'Подтверждение': 'Пузырь с новой позицией и сдвигом. Переход происходит через 600 мс после отпускания.', 'Оверлей': 'Не скрывается, пока идёт перемотка.' }),
        it('V', 'G6', 'Настройки', { v: v2, pos: 760, panel: 'settings', pf: 'quality' }, { 'Фокус': 'Панель изолирует фокус. При открытии — «Качество».', 'Back': 'Закрывает панель, фокус возвращается на «Настройки» (или туда, где он был, если открыто клавишей Menu).' }),
