<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="position:relative;width:1920px;height:1080px;background:#171615;overflow:hidden;display:flex;font-family:'Golos Text',sans-serif;color:#F4EFE7">
  <dc-import name="TV Sidebar" current="{{current}}" focus="{{navFocus}}" hint-size="336px,1080px"></dc-import>
  <div style="flex:1;min-width:0;padding:54px 96px 54px 48px;display:flex;flex-direction:column">
    <div style="font-size:44px;font-weight:600">{{section}}</div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding-bottom:80px">
      <div style="width:88px;height:88px;border-radius:50%;background:{{iconBg}};color:#1A1816;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;margin-bottom:12px">!</div>
      <div style="font-size:44px;font-weight:600">{{t}}</div>
      <div style="font-size:26px;line-height:1.45;color:#B7B0A6;max-width:820px;text-wrap:pretty">{{b}}</div>
      <div style="margin-top:20px"><dc-import name="TV Button" label="{{btn}}" f="{{btnF}}" hint-size="220px,80px"></dc-import></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;network&quot;,&quot;server&quot;,&quot;feed-empty&quot;,&quot;author-missing&quot;],&quot;default&quot;:&quot;network&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;search&quot;,&quot;subs&quot;,&quot;events&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;section&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Главная&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;btn&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = this.props, k = P.kind ?? 'network', F = P.focus ?? 'btn';
    const K = {
      network: ['Нет подключения к интернету', 'Проверьте Wi-Fi или кабель приставки. Когда связь вернётся, нажмите «Повторить».', 'Повторить', '#E0624F'],
      server: ['Boosty не отвечает', 'Сервер вернул ошибку. Это не связано с вашим аккаунтом. Попробуйте ещё раз через минуту.', 'Повторить', '#E0624F'],
      'feed-empty': ['В ленте пока пусто', 'Здесь появятся новые публикации авторов, на которых вы подписаны.', 'Обновить', '#8F887F'],
      'author-missing': ['Блог недоступен', 'Автор закрыл или удалил блог. Подписки и остальные разделы работают как обычно.', 'Назад', '#8F887F']
    }[k];
    return {
      current: P.current ?? 'home', section: P.section ?? 'Главная',
      navFocus: F.startsWith('nav-') ? F.slice(4) : '',
      t: K[0], b: K[1], btn: K[2], iconBg: K[3], btnF: F === 'btn'
    };
  }
}
</script>
</body>
</html>
