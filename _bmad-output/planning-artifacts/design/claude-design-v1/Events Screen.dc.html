<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="position:relative;width:1920px;height:1080px;background:#171615;overflow:hidden;display:flex;font-family:'Golos Text',sans-serif;color:#F4EFE7">
  <dc-import name="TV Sidebar" current="events" focus="{{navFocus}}" hint-size="336px,1080px"></dc-import>
  <div style="flex:1;min-width:0;padding:54px 96px 54px 48px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:baseline;gap:20px">
      <div style="font-size:44px;font-weight:600">События</div>
      <sc-if value="{{isList}}"><div style="font-size:24px;color:#8F887F">{{unreadLabel}}</div></sc-if>
    </div>
    <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
      <div style="margin-top:40px;display:flex;flex-direction:column;gap:14px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div style="width:1440px;height:112px;box-sizing:border-box;padding:0 32px 0 24px;border-radius:16px;display:flex;align-items:center;gap:24px;background:{{r.bg}};outline:{{r.ring}};outline-offset:4px;transform:{{r.tf}};transition:transform 160ms cubic-bezier(0.2,0,0,1)">
            <div style="flex:none;width:12px;height:12px;border-radius:50%;background:{{r.dot}}"></div>
            <div style="flex:none;width:64px;height:64px;border-radius:50%;background:{{r.av}};color:#1A1816;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600">{{r.ini}}</div>
            <div style="flex:1;min-width:0;font-size:26px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="font-weight:600">{{r.who}}</span> <span style="color:#D8D2C9">{{r.text}}</span></div>
            <sc-if value="{{r.isStream}}"><div style="flex:none;height:36px;padding:0 12px;border-radius:8px;background:#3A1E1B;color:#F08C7C;font-size:20px;font-weight:600;display:flex;align-items:center">Эфир</div></sc-if>
            <div style="flex:none;font-size:22px;color:#A9A299">{{r.time}}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isLoading}}">
      <div style="margin-top:40px;display:flex;flex-direction:column;gap:14px">
        <sc-for list="{{sk}}" as="s" hint-placeholder-count="5"><div style="width:1440px;height:112px;border-radius:16px;background:#1F1D1B"></div></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isState}}">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding-bottom:80px">
        <div style="font-size:44px;font-weight:600">{{stTitle}}</div>
        <div style="font-size:26px;line-height:1.45;color:#B7B0A6;max-width:820px;text-wrap:pretty">{{stBody}}</div>
        <div style="margin-top:20px"><dc-import name="TV Button" label="{{stBtn}}" f="{{true}}" hint-size="220px,80px"></dc-import></div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ev-0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;read&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const w = window;
    w.__tvd = w.__tvd || import(new URL('tv-data.js', document.baseURI).href);
    w.__tvd.then((m) => { this.D = m; this.forceUpdate(); });
  }
  renderVals() {
    const D = this.D, P = this.props;
    const mode = P.mode ?? 'list', F = P.focus ?? 'ev-0';
    const ev = D ? D.EVENTS : [];
    const read = P.read || [];
    const rows = D ? ev.map((e, i) => {
      const a = D.AUTHORS[e.a], f = F === 'ev-' + i, unread = e.unread && !read.includes(i);
      return { ini: a.ini, av: `oklch(0.72 0.09 ${a.hue})`, who: e.kind === 'stream' ? a.name : `«${a.title}»`, text: e.kind === 'stream' ? e.text : e.text.replace('новое событие в блоге', 'новое событие'), time: e.time, isStream: e.kind === 'stream',
        dot: unread ? '#E8914A' : 'transparent', bg: f ? '#3A3632' : '#221F1D', ring: f ? '4px solid #F4EFE7' : '4px solid transparent', tf: f ? 'scale(1.02)' : 'none' };
    }) : [];
    const unread = D ? ev.filter((e, i) => e.unread && !read.includes(i)).length : 0;
    return {
      navFocus: F.startsWith('nav-') ? F.slice(4) : '',
      isList: mode === 'list', isLoading: mode === 'loading', isState: mode === 'empty' || mode === 'error',
      rows, sk: [0, 1, 2, 3, 4], unreadLabel: unread ? `${unread} новых` : 'новых нет',
      stTitle: mode === 'empty' ? 'Событий пока нет' : 'Не удалось загрузить события',
      stBody: mode === 'empty' ? 'Здесь появится, например, начало эфира у автора, на которого вы подписаны.' : 'Нет соединения с сервером. Остальные разделы работают как обычно.',
      stBtn: mode === 'empty' ? 'Обновить' : 'Повторить'
    };
  }
}
</script>
</body>
</html>
