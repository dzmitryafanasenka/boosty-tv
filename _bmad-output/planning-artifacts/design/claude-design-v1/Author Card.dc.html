<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="width:464px;height:152px;box-sizing:border-box;display:flex;align-items:center;gap:24px;padding:0 24px;border-radius:16px;background:{{bg}};outline:{{ring}};outline-offset:4px;transform:{{tf}};box-shadow:{{shadow}};transition:transform 160ms cubic-bezier(0.2,0,0,1);font-family:'Golos Text',sans-serif">
  <div style="flex:none;width:104px;height:104px;border-radius:50%;background:{{avBg}};color:#1A1816;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:600">{{a.ini}}</div>
  <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1">
    <sc-if value="{{a.mine}}">
      <div style="align-self:flex-start;height:30px;padding:0 12px;border-radius:8px;background:#3A2A1C;color:#F2A462;font-size:20px;font-weight:600;display:flex;align-items:center">Мой блог</div>
    </sc-if>
    <div style="font-size:26px;line-height:32px;font-weight:600;color:{{titleColor}};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{a.title}}</div>
    <div style="font-size:22px;color:#A9A299;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{a.name}}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:200},&quot;a&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;focused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.a || { title: 'Название блога', name: 'Имя автора', ini: 'И', hue: 40 };
    const f = !!this.props.focused;
    return {
      a,
      bg: f ? '#34302C' : '#221F1D',
      ring: f ? '4px solid #F4EFE7' : '4px solid transparent',
      tf: f ? 'scale(1.05)' : 'none',
      shadow: f ? '0 18px 40px rgba(0,0,0,0.5)' : 'none',
      titleColor: f ? '#FFFFFF' : '#E6E0D8',
      avBg: `oklch(0.72 0.09 ${a.hue ?? 40})`
    };
  }
}
</script>
</body>
</html>
