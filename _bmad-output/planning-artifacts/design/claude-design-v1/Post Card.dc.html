<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></helmet>
<div style="width:{{w}}px;display:flex;flex-direction:column;gap:18px;transform:{{tf}};transform-origin:50% 35%;transition:transform 160ms cubic-bezier(0.2,0,0,1);font-family:'Golos Text',sans-serif">
  <div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:{{thumbBg}};outline:{{ring}};outline-offset:4px;box-shadow:{{shadow}}">
    <sc-if value="{{isImg}}" hint-placeholder-val="{{true}}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:16px;color:rgba(244,239,231,0.45)">{{thumbLabel}}</div>
    </sc-if>
    <sc-if value="{{isAvatar}}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <div style="width:96px;height:96px;border-radius:50%;background:{{avBg}};color:#1A1816;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600">{{p.ini}}</div>
      </div>
    </sc-if>
    <sc-if value="{{locked}}">
      <div style="position:absolute;inset:0;background:rgba(14,12,11,0.62);display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="width:30px;height:24px;box-sizing:border-box;border:5px solid #F4EFE7;border-bottom:none;border-radius:15px 15px 0 0"></div>
        <div style="width:46px;height:34px;border-radius:6px;background:#F4EFE7"></div>
      </div>
    </sc-if>
    <sc-if value="{{hasBadge}}">
      <div style="position:absolute;left:14px;top:14px;height:40px;box-sizing:border-box;padding:0 14px;border-radius:8px;background:{{badgeBg}};color:#F4EFE7;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600">
        <sc-if value="{{live}}"><div style="width:10px;height:10px;border-radius:50%;background:#FFFFFF"></div></sc-if>
        {{p.badge}}
      </div>
    </sc-if>
    <sc-if value="{{hasDur}}">
      <div style="position:absolute;right:14px;bottom:{{durBottom}};height:36px;box-sizing:border-box;padding:0 12px;border-radius:8px;background:rgba(18,16,14,0.85);color:#F4EFE7;display:flex;align-items:center;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums">{{p.dur}}</div>
    </sc-if>
    <sc-if value="{{hasProg}}">
      <div style="position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(244,239,231,0.22)">
        <div style="height:100%;width:{{progW}};background:#E8914A"></div>
      </div>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;padding:0 4px">
    <div style="font-size:26px;line-height:32px;height:64px;font-weight:600;color:{{titleColor}};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{p.title}}</div>
    <div style="display:flex;align-items:center;gap:12px;font-size:22px;color:#A9A299;min-width:0">
      <div style="flex:none;width:32px;height:32px;border-radius:50%;background:{{avBg}};color:#1A1816;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">{{p.ini}}</div>
      <div style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{meta}}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:360},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;focused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:336,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.p || { title: 'Заголовок поста', name: 'Автор', ini: 'А', date: 'Сегодня', hue: 40, badge: 'Видео' };
    const f = !!this.props.focused;
    const h = p.hue ?? 40;
    const isAvatar = p.kind === 'poll' || p.kind === 'file';
    const hasProg = p.prog != null;
    return {
      p, w: this.props.w ?? 336,
      tf: f ? 'scale(1.06)' : 'none',
      ring: f ? '4px solid #F4EFE7' : '4px solid transparent',
      shadow: f ? '0 18px 40px rgba(0,0,0,0.55)' : 'none',
      titleColor: f ? '#FFFFFF' : '#E6E0D8',
      thumbBg: isAvatar ? `oklch(0.27 0.025 ${h})` : `repeating-linear-gradient(135deg, oklch(0.31 0.03 ${h}) 0 16px, oklch(0.28 0.03 ${h}) 16px 32px)`,
      avBg: `oklch(0.72 0.09 ${h})`,
      isImg: !isAvatar, isAvatar,
      thumbLabel: p.thumbLabel || 'превью',
      hasBadge: !!p.badge, live: !!p.live,
      badgeBg: p.live ? '#C93C32' : 'rgba(18,16,14,0.85)',
      hasDur: !!p.dur, hasProg,
      durBottom: hasProg ? '22px' : '14px',
      progW: Math.round((p.prog || 0) * 100) + '%',
      meta: [p.name, p.sub || p.date].filter(Boolean).join(' · '),
      locked: !!p.locked
    };
  }
}
</script>
</body>
</html>
